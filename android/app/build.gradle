plugins {
    id 'com.android.application'
}

// Les fichiers de l'app web (dossier parent) sont embarqués dans l'APK : elle tourne en local.
def webSrc = rootProject.file('..')
def webOut = new File(layout.buildDirectory.get().asFile, 'generated/webassets')

def copyWebAssets = tasks.register('copyWebAssets', Sync) {
    from(webSrc) {
        include 'index.html', 'c.html', 'manifest.webmanifest', 'css/**', 'js/**', 'icons/**'
    }
    into new File(webOut, 'web')
}

def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.cartenfc.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cartenfc.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += [webOut]
        }
    }
}

tasks.named('preBuild') { dependsOn copyWebAssets }
