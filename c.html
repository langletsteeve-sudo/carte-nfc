<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="noindex">
<title>Carte de visite</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/card.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100dvh;background:var(--page,#111);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 16px calc(104px + env(safe-area-inset-bottom));padding-top:max(16px,env(safe-area-inset-top))}
  #root{max-width:440px;margin:0 auto}
  .msg{margin-top:35vh;text-align:center;color:#a1a1aa;font-size:15px}
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:28px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--page) 45%)}
  .bar[hidden]{display:none}
  .bar button{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:54px;border:0;border-radius:16px;font:600 16px/1 var(--font,system-ui),system-ui,sans-serif;cursor:pointer;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
  .bar .main{flex:1;max-width:340px;background:var(--acc);color:var(--on-acc)}
  .bar .sec{width:54px;flex:none;background:color-mix(in srgb,var(--acc) 18%,var(--page));color:var(--acc)}
  .bar .ic{width:21px;height:21px}
</style>
<script type="module" src="js/viewer.js"></script>
</head>
<body>
<main id="root"><p class="msg">Chargement...</p></main>
<div class="bar" id="bar" hidden>
  <button class="main" id="btnSave" type="button">Enregistrer le contact</button>
  <button class="sec" id="btnShare" type="button" aria-label="Partager cette carte"></button>
</div>
</body>
</html>
